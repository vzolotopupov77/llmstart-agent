- id: gr-gl-0003
  input: В каких курсах каталога встречается тема MCP (Model Context Protocol)?
  expected_output:
    segment: b2c
    product_codes:
    - fullstack-aidd
    - agents
    - deep-agents
    answer_key_points:
    - MCP есть в трёх курсах — fullstack-aidd, agents и deep-agents
    - в agents MCP — отдельная тема 8 (2 часа, создание MCP-серверов)
    - в deep-agents MCP используется для context engineering (тема 7)
    - в vibe-coding MCP явно не выделяется как отдельная тема
    required_entities:
    - fullstack-aidd
    - agents
    - deep-agents
    - MCP
