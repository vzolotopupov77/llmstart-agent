- id: e2e-reg-0003
  input: Привет. У меня вопрос про интеснив. По каким дням и во сколько семинары?
  expected_output:
    segment: b2c
    product_codes:
    - vibe-coding-intensive
    answer_key_points:
    - распознать запрос как интенсив по Cursor
    - 'дать структуру: созвоны, практика, поддержка в чате'
    - при необходимости уточнить, что речь о vibe-coding-intensive
    - явно назвать code vibe-coding-intensive
    - даже при TBD расписании — дать структуру семинары, практика, чат-поддержка
    should_clarify: false
    tools:
    - name: list_b2c_products
      args: {}
    - name: search_knowledge_base
      args:
        query: расписание интенсив Cursor
        audience: b2c
    must_not:
    - отказ «нет данных о расписании» без описания структуры intensive
  metadata:
