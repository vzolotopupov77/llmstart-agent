- id: e2e-reg-0007
  input:
  - role: user
    content: Привет. У меня вопрос про интеснив. По каким дням и во сколько семинары?
  - role: assistant
    content: 'Интенсив vibe-coding-intensive: основной созвон в пятницу днём, неделя поддержки в чате, финальный разбор на
      следующей неделе. Подробности на llmstart.ru.'
  - role: user
    content: Нет так со мной не сработает. Я знаю что я не посмотрю в итоге видео. Синхрон это важно. Есть более привычные
      форматы — 2 или 3 раза в неделю созвоны после рабочего дня. А я работаю и собираюсь продолжать.
  expected_output:
    segment: b2c
    product_codes:
    - vibe-coding-intensive
    answer_key_points:
    - признать, что записи не подходят пользователю
    - не настаивать на async как основном решении
    - 'предложить альтернативу: поток с вечерним или выходным расписанием'
    - не обещать конкретные даты без данных из KB
    - ответить на последний user turn про вечерние созвоны после работы
    should_clarify: false
    tools:
    - name: search_knowledge_base
      args:
        query: расписание интенсив вечер выходные
        audience: b2c
    must_not:
    - предлагать другой продукт или intensive без ответа на sync-objection
