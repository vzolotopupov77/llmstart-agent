- id: e2e-qa-0001
  input: Добрый день. Заинтересовал комбо курс. Скажите, какой формат у курсов? Можно будет проходить в свое удобное время?
    Или есть какое-то расписание? Не могу найти его на сайте.
  expected_output:
    segment: b2c
    product_codes:
    - ai-agents-combo
    answer_key_points:
    - формат онлайн с практическими заданиями и учебным репозиторием
    - комбо включает agents, deep-agents, fullstack-aidd и vibe-coding-intensive
    - можно проходить в своём темпе, есть поддержка в чате курса
    - консультация с экспертом — отдельный продукт consultation
    should_clarify: false
    tools:
    - name: search_knowledge_base
      args:
        query: формат обучения комбо расписание
        audience: b2c
  metadata:
    segment: b2c
    intent: G1.1
    source: real_dialog
    source_chat: CHAT_0014
    turn_mode: single
    gt_quality: approximate
    reviewed_by: product-owner
    difficulty: medium
    legacy_id: b2c-rag-001
