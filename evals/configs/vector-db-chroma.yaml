config_id: vector-db-chroma
comment: "Chroma embedded baseline for vector bench (sprint-08)"

agent:
  impl: langchain-react
  api_url: http://127.0.0.1:8003/api/v1/chat

retrieval:
  backend: chroma
  embedding_model: openai/text-embedding-3-small
  chunk_size: 800
  top_k: 4

model:
  provider: openrouter
  name: openai/gpt-4o-mini
  temperature: 0.0

judge:
  provider: openrouter
  name: google/gemini-2.5-flash-lite
  temperature: 0.0

prompt:
  source: code
  name: agent-system-prompt-v2

datasets:
  e2e-qa: v002
