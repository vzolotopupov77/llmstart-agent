name: default
topic: "Общий Python-проект"
description: "Универсальная рубрика для любого Python-проекта"

aspects:
  - id: structure
    name: "Структура проекта"
    criteria:
      - "Логичная организация файлов и модулей"
      - "Разделение ответственности (CLI / бизнес-логика / конфиг)"
      - "Нет монолитных файлов на сотни строк без причины"

  - id: code-quality
    name: "Качество кода"
    criteria:
      - "Говорящие имена функций, переменных, модулей"
      - "Типизация и docstring там, где это помогает"
      - "Следование PEP 8 и идиомам Python"
      - "Отсутствие дублирования и мёртвого кода"

  - id: error-handling
    name: "Обработка ошибок"
    criteria:
      - "Fail-fast для невалидного ввода и конфигурации"
      - "Понятные сообщения об ошибках без traceback для пользователя"
      - "Timeout и обработка сетевых ошибок для внешних вызовов"
      - "Не глотать исключения (except: pass)"

  - id: documentation
    name: "Документация"
    criteria:
      - "README с инструкцией запуска"
      - "Примеры использования CLI/API"
      - "Описание зависимостей и переменных окружения"
